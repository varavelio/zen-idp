# This example uses "12345678" as the admin password and the client secret
# For production always change this to a hash of random secret generated
# using the "zen-idp generate-secrets" command

config:
  issuer: "http://my-zen-idp:8080"
  security:
    admin_password_hash: "$argon2id$v=19$m=65536,t=3,p=4$NDE5OGE1OTFjZDU2MTQwZGU2NzBkNWFhYTc2MTRmMDg$PcmvP5+lj4zh64AxsmiLbO1P4dE42X+YRytzIrqzLfM"

clients:
  - id: "my-app-oauth2-proxy"
    secret_hash: "$argon2id$v=19$m=65536,t=3,p=4$NDE5OGE1OTFjZDU2MTQwZGU2NzBkNWFhYTc2MTRmMDg$PcmvP5+lj4zh64AxsmiLbO1P4dE42X+YRytzIrqzLfM"
    redirect_uris:
      - "http://127.0.0.1:37746/oauth2/callback"

users:
  # Using the demo root secret the OTP secret key for alice is:
  # FRZJVCJOS5ZKYPWG5EBTTTVEDCHBKWNDCCZOCHR5YA4CY5X7KR6Q
  #
  # Generate demo OTP codes here: https://soar.github.io/totp-generator
  # just copy and paste the secret key in the website
  # (for testing only, never use it for production)
  - sub: "alice"
