# Zen IdP + Grafana: sign in to Grafana with Zen IdP as the identity provider.
#
# Try it:
#   1. docker compose up
#   2. Open http://localhost:37747 (Grafana)
#   3. Click "Sign in with Zen IdP" and sign in with alice + a TOTP code
#      (alice's TOTP secret is in config.yaml)
#
# DEMO ONLY: every secret is hardcoded and public so the stack runs as-is.
# Never deploy it like this; generate real secrets with "zen-idp generate-secrets".
#
# Same pattern as other examples: config.yaml declares the issuer
# http://localhost:59115, the browser reaches it through the published port,
# and Grafana resolves "localhost" to Zen IdP's fixed container IP through
# the extra_hosts entry below (Grafana calls the token and userinfo
# endpoints from inside the stack, while the browser only follows the
# authorization redirect).

networks:
  default:
    ipam:
      config:
        - subnet: 10.10.10.0/24

services:
  zen-idp:
    image: varavel/zen-idp:latest
    ports:
      - "127.0.0.1:59115:59115"
    environment:
      # DEMO ONLY root secret; with it, alice's TOTP secret is the one in config.yaml
      ZEN_IDP_SECRET: "00000000000000000000000000000000"
    volumes:
      - ./config.yaml:/data/config/config.yaml:ro
    networks:
      default:
        ipv4_address: 10.10.10.10

  grafana:
    image: grafana/grafana:latest
    depends_on:
      zen-idp:
        condition: service_healthy
    ports:
      - "127.0.0.1:37747:3000"
    extra_hosts:
      # Resolve the issuer http://localhost:59115 from inside the stack
      - "localhost:10.10.10.10"
    environment:
      # The browser-facing URL of Grafana; must match the redirect URIs in config.yaml
      GF_SERVER_ROOT_URL: "http://localhost:37747"

      # OIDC login through Zen IdP (generic OAuth provider)
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Zen IdP"
      # DEMO ONLY credentials, declared in config.yaml
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "87654321"
      # The three Zen IdP endpoints behind the issuer URL
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:59115/authorize"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://localhost:59115/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://localhost:59115/userinfo"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      # DEMO ONLY: alice@example.com is the demo user
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: "example.com"
