# Zen IdP + OliveTin: a dashboard of one-click actions, signed in through
# Zen IdP, with three actions that ping public websites.
#
# Try it:
#   1. docker compose up -d
#   2. Open http://localhost:37749
#   3. Sign in with alice + a TOTP code (alice's TOTP secret is in config.yaml)
#   4. Run "Ping google.com", "Ping github.com" or "Ping wikipedia.com"
#
# DEMO ONLY: every secret is hardcoded and public so the stack runs as-is.
# Never deploy it like this; generate real secrets with "zen-idp generate-secrets".
#
# Same pattern as other examples: config.yaml declares the issuer
# http://localhost:59115, the browser reaches it through the published port,
# and OliveTin resolves "localhost" to Zen IdP's fixed container IP through
# the extra_hosts entry below (OliveTin exchanges tokens and reads the
# userinfo endpoint from inside the stack).

networks:
  default:
    ipam:
      config:
        - subnet: 10.10.10.0/24

services:
  zen-idp:
    image: varavel/zen-idp:latest
    ports:
      - "127.0.0.1:59115:59115"
    environment:
      # DEMO ONLY root secret; with it, alice's TOTP secret is the one in config.yaml
      ZEN_IDP_SECRET: "00000000000000000000000000000000"
    volumes:
      - ./config.yaml:/data/config/config.yaml:ro
    networks:
      default:
        ipv4_address: 10.10.10.10

  olivetin:
    image: jamesread/olivetin:latest
    depends_on:
      zen-idp:
        condition: service_healthy
    ports:
      - "127.0.0.1:37749:1337"
    extra_hosts:
      # Resolve the issuer http://localhost:59115 from inside the stack
      - "localhost:10.10.10.10"
    volumes:
      # The actions and OAuth2 settings OliveTin runs with
      - ./olivetin.yaml:/config/config.yaml:ro
