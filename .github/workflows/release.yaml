name: Release

on:
  release:
    types: [published]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      update_latest: ${{ steps.vars.outputs.update_latest }}
    steps:
      - id: vars
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Release tags must start with a lowercase "v" followed by a digit
          # (e.g. v1.2.3) to keep them consistent.
          if [[ "${TAG}" != v[0-9]* ]]; then
            echo "::error::Release tag must start with a lowercase \"v\" followed by a digit, got \"${TAG}\""
            exit 1
          fi

          # Version without the leading "v", used for Docker tags, release
          # assets, and Homebrew formulas.
          VERSION="${TAG#v}"

          # Only stable versions (no pre-release suffix) update the `latest` tag.
          if [[ "${VERSION}" != *"-"* ]]; then
            UPDATE_LATEST="true"
          else
            UPDATE_LATEST="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"

  build-and-upload:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    needs: [setup]
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build the release archives
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: >-
            /bin/bash -lc
            "ZEN_IDP_VERSION='${{ needs.setup.outputs.version }}' task release"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*.tar.gz
            ./dist/*.zip
            ./dist/checksums.txt
            ./dist/manifest.json

  publish-homebrew:
    name: Publish to Homebrew tap
    runs-on: ubuntu-latest
    needs: [setup, build-and-upload]
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: varavelio/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate the Homebrew formulas
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: >-
            /bin/bash -lc
            "go run ./installers/brew
            '${{ needs.setup.outputs.version }}'
            ./homebrew-tap"

      - name: Update the Homebrew tap
        run: |
          git -C homebrew-tap config user.name "Varavel Release Bot"
          git -C homebrew-tap config user.email "release-bot@varavel.com"
          git -C homebrew-tap add Formula/zen-idp
          if git -C homebrew-tap diff --cached --quiet; then
            echo "No changes detected in Formula directory"
            exit 0
          fi
          git -C homebrew-tap commit -m "chore: update zen-idp to ${TAG}"
          git -C homebrew-tap push

  build-and-push-images:
    name: Build and push ${{ matrix.vars.platform }}
    runs-on: ${{ matrix.vars.os }}
    needs: [setup]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      matrix:
        vars:
          - { os: ubuntu-24.04, platform: amd64 }
          - { os: ubuntu-24.04-arm, platform: arm64 }
    env:
      DOCKER_VERSION: ${{ needs.setup.outputs.version }}
      PLATFORM: ${{ matrix.vars.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: >
          docker build
          --target production
          --tag varavel/zen-idp:${DOCKER_VERSION}-${PLATFORM}
          --tag ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-${PLATFORM}
          .

      - name: Push the Docker images
        run: |
          docker push varavel/zen-idp:${DOCKER_VERSION}-${PLATFORM}
          docker push ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-${PLATFORM}

  merge-and-push-manifest:
    name: Merge and push manifest
    runs-on: ubuntu-latest
    needs: [setup, build-and-push-images]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    env:
      DOCKER_VERSION: ${{ needs.setup.outputs.version }}
      UPDATE_LATEST: ${{ needs.setup.outputs.update_latest }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push manifests
        run: |
          docker manifest create varavel/zen-idp:${DOCKER_VERSION} \
            --amend varavel/zen-idp:${DOCKER_VERSION}-amd64 \
            --amend varavel/zen-idp:${DOCKER_VERSION}-arm64
          docker manifest push varavel/zen-idp:${DOCKER_VERSION}

          docker manifest create ghcr.io/varavelio/zen-idp:${DOCKER_VERSION} \
            --amend ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-amd64 \
            --amend ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-arm64
          docker manifest push ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            docker manifest create varavel/zen-idp:latest \
              --amend varavel/zen-idp:${DOCKER_VERSION}-amd64 \
              --amend varavel/zen-idp:${DOCKER_VERSION}-arm64
            docker manifest push varavel/zen-idp:latest

            docker manifest create ghcr.io/varavelio/zen-idp:latest \
              --amend ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-amd64 \
              --amend ghcr.io/varavelio/zen-idp:${DOCKER_VERSION}-arm64
            docker manifest push ghcr.io/varavelio/zen-idp:latest
          fi

  notify-release-failure:
    name: Notify release failure
    runs-on: ubuntu-latest
    needs:
      [
        setup,
        build-and-upload,
        publish-homebrew,
        build-and-push-images,
        merge-and-push-manifest,
      ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Update the release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BODY="$(gh release view "${TAG}" --json body --jq '.body')"
          NOTE=$'\n\n---\n\n> [!WARNING]\n> The release workflow failed. Use the next release instead.'

          if [[ "${BODY}" == *"The release workflow failed"* ]]; then
            echo "Failure note already present in the release description, skipping"
            exit 0
          fi

          gh release edit "${TAG}" --notes "${BODY}${NOTE}"
