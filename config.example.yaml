# Zen IdP configuration example
#
# This file shows every supported YAML field. Copy only the settings you need:
# optional settings use secure defaults when omitted.
#
# Runtime secrets and infrastructure paths do not belong in this file:
# - ZEN_IDP_SECRET must contain a high-entropy secret of at least 32 characters.
# - ZEN_IDP_DB_PATH must point to the SQLite state file.
# - ZEN_IDP_CONFIG_PATH must select this file or its containing configuration set.

config:
  # Required absolute URL used as the OIDC issuer and public URL base. It must
  # use HTTPS in production and must not contain userinfo, a query, or a fragment.
  # Plain HTTP is accepted only for localhost or loopback development.
  issuer: "https://auth.example.com"

  # Optional local HTTP listener. Zen IdP does not terminate TLS; put a reverse
  # proxy, Cloudflare, or equivalent HTTPS infrastructure in front of it.
  server:
    # Host or IP address to bind. Defaults to 0.0.0.0 when omitted.
    # Use 127.0.0.1 when the listener should be reachable only from your local machine.
    host: "0.0.0.0"

    # TCP port to bind. Defaults to 8080. Valid values are 1 through 65535.
    port: 8080

  # Optional presentation settings for login and enrollment pages.
  ui:
    # Product or organization name displayed to users.
    name: "Example Company Auth"

    # Optional absolute HTTPS logo URLs, one per color scheme. When both are
    # set, the light logo is shown in light mode and the dark logo in dark
    # mode; when only one is set, it is shown in both modes. To use the same
    # logo everywhere, simply set the same URL in both fields.
    logo_light_url: "https://example.com/assets/logo-light.png"
    logo_dark_url: "https://example.com/assets/logo-dark.png"

    # Optional absolute HTTPS browser favicon URL.
    favicon_url: "https://example.com/assets/favicon.ico"

  security:
    # Required. Argon2id hash of the administrator password, never plaintext.
    # The placeholder below is intentionally invalid. Replace it with a securely
    # generated Argon2id PHC hash before running Zen IdP. The
    #
    # The `zen-idp generate-secrets` command prints a compatible plain/hash pair.
    admin_password_hash: "$argon2id$......"

    # Optional failed-login and client-authentication limits. Both identifiers (sub and
    # idp_login) of a known user share one counter keyed by sub. Unknown identifiers are
    # bounded separately. Source IP is never used; configure IP limits at your edge
    # (CDN, reverse proxy, etc).
    rate_limits:
      # Failed attempts allowed per login identifier. Range 1-100; default 5.
      max_user_login_attempts: 5

      # Counting window in seconds. Range 1-86400; default 300 (5 minutes).
      user_login_attempts_window_seconds: 300

      # Failed client authentication attempts allowed per client id, protecting
      # confidential client secrets from brute force. Range 1-100; default 5.
      max_client_auth_attempts: 5

      # Counting window in seconds. Range 1-86400; default 300 (5 minutes).
      client_auth_attempts_window_seconds: 300

    # Optional Zen IdP browser session settings.
    session:
      # Absolute session lifetime in hours. Range 1-8760; default 72.
      max_age_hours: 72

  # Optional periodic state-cleanup settings. A background cleaner runs at the
  # configured interval and removes disposable state that can never become
  # usable again: expired rate-limit counters, expired one-use tokens, expired
  # sessions, and audit records older than the configured retention.
  maintenance:
    # Seconds between cleanup passes. Range 60-86400; default 3600 (1 hour).
    # A pass also runs once at startup.
    cleanup_interval_seconds: 3600

    # Hours that audit records are retained before cleanup removes them.
    # Range 0-87600; default 720 (30 days). Set 0 to keep audit records
    # indefinitely.
    audit_retention_hours: 720

# OIDC clients. Use one list item per application.
clients:
  - # Required nonblank, unique client identifier sent by the application.
    id: "grafana-prod"

    # Optional human-readable name. It defaults to id when omitted.
    name: "Grafana"

    # Optional Argon2id hash of the client secret, never plaintext.
    # Providing it creates a confidential client. Omitting it creates a public
    # client suitable for a mobile app, SPA, or another client without a safe
    # place to store credentials. PKCE S256 is required for public clients and
    # optional (but recommended) for confidential clients that authenticate with
    # a secret.
    #
    # The `zen-idp generate-secrets` command prints a compatible plain/hash pair.
    secret_hash: "$argon2id$......"

    # Required list of unique, exact callback URIs. Fragments and wildcards are
    # forbidden. HTTPS is standard; local HTTP is limited to loopback hosts.
    redirect_uris:
      - "https://grafana.example.com/login/generic_oauth"

  # Public native-app example. Both name and secret_hash are omitted, so the
  # display name defaults to "mobile-app" and no client secret is required.
  - id: "mobile-app"
    redirect_uris:
      - "com.example.app:/oauth/callback"

# Human identities. Each user is a mapping and must have a unique sub value.
users:
  - # Required stable OIDC subject: 1-255 case-sensitive US-ASCII characters.
    # Do not reuse or rename as it is the stable user identifier.
    sub: "user-001"

    # Optional additional nonempty login. The user can always sign in with sub;
    # when this field is present, either value authenticates the same identity.
    idp_login: "alice@example.com"

    # Optional non-negative TOTP credential revision. Defaults to 0.
    # Increment it to rotate this user's deterministic TOTP secret.
    idp_totp_rev: 0

    # Optional absolute account expiration as a quoted RFC3339 timestamp.
    # At and after this instant, the user can no longer authenticate.
    idp_expires_at: "2030-12-31T23:59:59Z"

    # Any additional JSON-compatible fields are custom OIDC claims. All clients
    # receive them, so never place secrets here. Keys beginning with idp_ and
    # protocol claims such as iss, aud, exp, nonce, or auth_time are reserved.
    name: "Alice Example"
    email: "alice@example.com"
    groups:
      - "engineering"
      - "operators"
    profile:
      department: "Platform"
      active: true

  # The smallest valid user signs in with sub, uses revision 0, has no
  # expiration, and has no custom claims.
  - sub: "service-owner"
