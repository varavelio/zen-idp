# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List all available commands
    cmd: task --list-all

  ci:
    desc: Run full CI pipeline (deps, format, lint, test, e2e)
    cmds:
      - task: deps
      - task: format
      - task: lint
      - task: test
      - task: e2e

  deps:
    desc: Install dependencies for the project
    cmds:
      - go mod download
      - bash scripts/download-fonts.sh

  serve:
    desc: Build and run serve subcommand with .env
    deps:
      - build
    cmd: ./dist/zen-idp serve --env-file .env

  validate-config:
    desc: Build and run validate-config subcommand with .env
    deps:
      - build
    cmd: ./dist/zen-idp validate-config --env-file .env

  generate-secrets:
    desc: Build and run generate-secrets subcommand
    deps:
      - build
    cmd: ./dist/zen-idp generate-secrets

  docs:
    desc: Generate documentation site using veta
    dir: ./docs
    cmd: veta build

  build:
    desc: Build the project
    deps:
      - codegen
    cmd: go build -o ./dist/zen-idp ./cmd/zen-idp/.

  build:prod:
    desc: Build the project with production optimizations
    deps:
      - codegen
    cmd: go build -trimpath -ldflags "-s -w" -o ./dist/zen-idp ./cmd/zen-idp/.

  release:
    desc: Build all release artifacts into dist
    cmd: go run ./scripts/release

  codegen:
    desc: Run code generators (SQLC, TailwindCSS)
    cmds:
      - sqlc generate
      - cd ./internal/ui && tailwindcss -i ./tailwind.css -o ./static/build/app.css --silent --minify

  format:
    desc: Format all code
    cmds:
      - dprint fmt --config ./dprint.json --log-level warn
      - golangci-lint fmt ./...

  lint:
    desc: Lint all code
    cmds:
      - dprint check --config ./dprint.json --log-level warn
      - golangci-lint run ./...
      - deno lint ./e2e/browser/.

  test:
    desc: Run all tests
    cmds:
      - go test ./...
      - CGO_ENABLED=1 go test -race ./...

  e2e:
    desc: Run the black-box end-to-end test suite against the compiled binary
    deps:
      - build
    cmds:
      - go test -tags e2e -count=1 -timeout 10m ./e2e/http/...
      - golangci-lint run --build-tags e2e ./e2e/http/...
      - cd ./e2e/browser && deno task test

  goose:
    desc: Run goose binary (configured for statestore)
    cmd: goose {{.CLI_ARGS}}
    env:
      GOOSE_DRIVER: sqlite3
      GOOSE_DBSTRING: ./state.db
      GOOSE_MIGRATION_DIR: ./internal/statestore/migrations
