[package]
name = "zen-idp"
version = "0.1.0"
authors = ["Varavel"]
documentation = "https://zen-idp.varavel.com"
edition = "2024"
homepage = "https://zen-idp.varavel.com"
license = "MIT"
readme = "README.md"
repository = "https://github.com/varavelio/zen-idp"
rust-version = "1.97.1"
description = "A declarative, zero-maintenance OIDC Identity Provider"

[dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
clap = { version = "4.6.4", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["std"] }
thiserror = "2.0.18"
zeroize = "1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
